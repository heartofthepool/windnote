<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nốt nhạc Saxophone</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --ink:#1d1f24; --muted:#6b6f78; --line:#e3ded5;
    --brass:#b9822a; --brass-soft:#f5e7cc; --concert:#2b7bb9;
    --pressed:#1d1f24; --open:#ffffff;
    --gap:clamp(6px,1vmin,14px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:clamp(11px,1.15vmin + .3vw,15px)}
  /* ===== Bố cục 1 trang ===== */
  .app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) clamp(130px,25vh,280px);
    gap:var(--gap);padding:var(--gap)}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:1.5em;margin:0} h1 span{color:var(--brass)}
  .middle{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--gap);min-height:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:var(--gap);min-height:0;min-width:0}
  h2{font-size:.82em;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 .5em}
  .hint{color:var(--muted);font-size:.82em;margin:.4em 0 0}

  .seg{display:inline-flex;background:#e9e4da;border-radius:12px;padding:4px;gap:4px}
  .seg button{border:0;background:transparent;padding:.6em 1.2em;border-radius:9px;font-size:1em;font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg.small button{padding:.35em .8em;font-size:.85em}
  header h1{white-space:nowrap}
  /* ===== Thanh chọn nhạc cụ ===== */
  .instbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  #instSeg button,.fam>button{padding:.35em .8em;line-height:1.15;white-space:nowrap}
  #instSeg button b,.fam>button b{display:block;font-size:.92em}
  #instSeg button small,.fam>button small{display:block;font-size:.7em;font-weight:500;opacity:.8;max-width:11em;overflow:hidden;text-overflow:ellipsis}
  .fam{position:relative}
  .fam>button{border:1px solid var(--line);background:#fbfaf7;border-radius:12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;text-align:left}
  .fam>button:hover{background:#f1ece2}
  .fam>button.on{background:var(--card);color:var(--ink);border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
  .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;min-width:15em;max-height:70vh;overflow:auto;display:none}
  .fam.open .menu{display:block}
  .menu button{display:flex;justify-content:space-between;gap:1em;width:100%;border:0;background:transparent;font:inherit;text-align:left;
    padding:.45em .7em;border-radius:8px;cursor:pointer;color:var(--ink)}
  .menu button:hover{background:#f3efe6}
  .menu button.on{background:var(--brass);color:#fff}
  .menu button small{color:var(--muted);white-space:nowrap} .menu button.on small{color:#f5e7cc}

  /* ===== Trái: thế bấm ===== */
  .left{display:flex;flex-direction:column}
  .fings{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
  .fing{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;
    padding:.5em;background:#fdfcfa}
  .fing h4{margin:0 .2em;font-size:1em;height:1.45em;line-height:1.45em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fing.empty{background:transparent;border-style:dashed;opacity:.5}
  .fing .tag{display:inline-block;font-size:.72em;background:var(--brass-soft);color:#7a5414;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .fing p{margin:.2em .2em .3em;font-size:.8em;color:var(--muted);line-height:1.3;height:3.9em;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .fing .svgbox{flex:1;min-height:0;position:relative}
  .fing svg{position:absolute;inset:0;width:100%;height:100%}
  .fing .keys{font-size:.78em;margin:.3em .2em 0;height:1.3em;line-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  svg .k{stroke:#3a3d44;stroke-width:1.6;fill:var(--open)}
  svg .k.p{fill:var(--pressed)}
  svg .t{font-size:9px;text-anchor:middle;dominant-baseline:central;fill:#3a3d44;pointer-events:none;font-weight:600}
  svg .t.p{fill:#fff}
  svg .cap{font-size:10px;fill:var(--muted);text-anchor:middle}
  svg .k.back{stroke-dasharray:3 2}
  svg .big-t{font-size:15px;font-weight:700;fill:#1d1f24;text-anchor:middle}
  svg .mid-t{font-size:11px;fill:#3a3d44;text-anchor:middle}

  /* ===== Phải: thông số ===== */
  .right{display:flex;flex-direction:column;gap:var(--gap);overflow:auto}
  .sel{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.6em 1.6em}
  .big{font-size:clamp(22px,3.2vmin + 1vw,46px);font-weight:700;line-height:1}
  .lbl{font-size:.72em;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.3em}
  .written .big{color:var(--brass)} .concert .big{color:var(--concert)}
  .sub{font-size:.85em;color:var(--muted);margin-top:.25em}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fbfaf7;border-radius:10px;padding:.5em .9em;font-size:.95em;font-weight:600;cursor:pointer}
  .btn:hover{background:#f1ece2}
  .group{margin-bottom:.3em}
  .group h3{font-size:.74em;margin:0 0 .2em;color:var(--muted);font-weight:600}
  .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.3em,1fr));gap:3px}
  .chip{border:1px solid var(--line);background:#fbfaf7;border-radius:7px;padding:.18em .1em;cursor:pointer;text-align:center;line-height:1.15;font:inherit}
  .chip b{display:block;font-size:.9em}
  .chip small{font-size:.7em;color:var(--concert)}
  .chip.r1{background:#fbfaf7} .chip.r2{background:#f3efe6} .chip.r3{background:#ebe4d4}
  .reg{display:flex;gap:1em;font-size:.72em;color:var(--muted);margin-bottom:.3em}
  .reg i{display:inline-block;width:.9em;height:.9em;border:1px solid var(--line);border-radius:3px;margin-right:.3em;vertical-align:-1px}
  .chip.on{background:var(--brass);border-color:var(--brass);color:#fff}
  .chip.on small{color:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:.4em 1em;align-items:center;font-size:.85em}
  .dot{display:inline-block;width:.9em;height:.9em;border-radius:3px;margin-right:.4em;vertical-align:-1px}

  /* ===== Tuner ===== */
  .tuner{flex:1 1 0;min-height:9.5em;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;padding:.6em;background:#fdfcfa}
  .tun-head{display:flex;flex-wrap:wrap;align-items:center;gap:.3em .8em}
  .tun-head .btn{padding:.35em .8em}
  .tun-opts{display:flex;flex-wrap:wrap;gap:.2em .9em;margin-left:auto}
  .tun-opt{font-size:.82em;color:var(--muted);display:inline-flex;align-items:center;gap:.3em}
  .tun-opt input[type=number]{width:4.4em;font:inherit;padding:.15em .3em;border:1px solid var(--line);border-radius:6px}
  .tun-body{flex:1;min-height:0;display:flex;align-items:center;gap:1em;margin-top:.3em}
  .gauge{flex:0 1 auto;height:100%;min-height:0;max-width:52%;aspect-ratio:220/128}
  .gauge text{font-size:9px;fill:var(--muted);text-anchor:middle}
  #needle{transition:transform .12s linear;transform-origin:110px 112px}
  .tun-read{flex:1 1 45%;min-width:0}
  .tun-note{font-size:clamp(26px,4vmin + .8vw,56px);font-weight:700;line-height:1.05}
  /* Giữ chỗ cố định cho dòng phụ và ô nhắc nhở để chữ nốt không bị nhảy */
  .tun-read .sub{min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tun-status{margin-top:.4em;font-weight:600;font-size:.95em;line-height:1.3;padding:.35em .6em;border-radius:8px;
    display:block;box-sizing:border-box;height:calc(2.6em + .7em);overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:background .2s,color .2s}
  .tun-status:empty{background:transparent}
  .st-ok{background:#dff3e3;color:#1f6b33} .st-near{background:#fbf0d6;color:#7a5414}
  .st-off{background:#fbe1dd;color:#9b2c1f} .st-other{background:#e7eef6;color:#24557f}
  .wk.live,.bk.live{box-shadow:inset 0 0 0 3px #2fa04a}
  #micBtn.on{background:#1d1f24;color:#fff;border-color:#1d1f24}

  /* ===== Dưới: piano tự co giãn ===== */
  .bottom{display:flex;flex-direction:column}
  .piano{position:relative;flex:1;min-height:0;margin-top:1.5em}
  .wk,.bk{position:absolute;top:0;border-radius:0 0 5px 5px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
  .wk{background:#fff;border:1px solid #b9b4aa;height:100%}
  .wk span{font-size:clamp(7px,.75vw + .3vh,12px);color:#555;margin-bottom:.4em;font-weight:600}
  .wk.c span{color:#111}
  .bk{background:#22252b;height:62%;z-index:2}
  .bk span{font-size:clamp(5px,.5vw + .2vh,9px);color:#cfd2d8;margin-bottom:.3em}
  .wk.w,.bk.w{background:var(--brass)} .wk.cc,.bk.cc{background:var(--concert)}
  .wk.w span,.bk.w span,.wk.cc span,.bk.cc span{color:#fff}
  .badge{position:absolute;bottom:100%;margin-bottom:3px;left:50%;transform:translateX(-50%);font-size:clamp(9px,.8vw,12px);font-weight:700;color:#fff;
    border-radius:5px;padding:1px 5px;white-space:nowrap;z-index:3}
  .badge.w{background:var(--brass)} .badge.cc{background:var(--concert)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d1f24;color:#fff;padding:10px 16px;
    border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}

  /* Màn hình hẹp (điện thoại dọc): xếp chồng, cho phép cuộn */
  @media (max-width:760px), (max-height:420px){
    body{overflow:auto}
    .app{height:auto;grid-template-rows:auto auto auto}
    .middle{grid-template-columns:1fr}
    .fings{height:62vh}
    .bottom{height:200px}
    .right{overflow:visible}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Nốt nhạc <span>Saxophone</span></h1>
    <div class="instbar">
      <div class="seg" id="instSeg"></div>
      <div id="fams" class="instbar"></div>
    </div>
  </header>

  <div class="middle">
    <section class="card left">
      <h2 id="fingTitle">Cách bấm</h2>
      <div class="fings" id="fings"></div>
      <p class="hint" id="fingHint"></p>
    </section>

    <section class="card right">
      <div class="sel">
        <div class="written"><div class="lbl"><span class="wWord">Nốt kèn</span> · thế bấm</div><div class="big" id="wName"></div><div class="sub" id="wSol"></div></div>
        <div class="concert"><div class="lbl">Âm thanh thật</div><div class="big" id="cName"></div><div class="sub" id="cSol"></div></div>
      </div>
      <div class="actions">
        <button class="btn" id="playBtn">▶ Nghe</button>
        <button class="btn" id="prevBtn" title="Nốt trước (←)">◀ Nốt trước</button>
        <button class="btn" id="nextBtn" title="Nốt sau (→)">Nốt sau ▶</button>
      </div>
      <div>
        <h2>Chọn nốt (<span class="wWordL">nốt kèn</span>)</h2>
        <div id="groups"></div>
      </div>

      <div class="tuner" id="tuner">
        <div class="tun-head">
          <h2 style="margin:0">Tuner (micro)</h2>
          <button class="btn" id="micBtn">🎤 Bật tuner</button>
          <span class="tun-opts">
            <label class="tun-opt"><input type="checkbox" id="followChk"> Tự chọn nốt theo tiếng thổi</label>
            <label class="tun-opt">A4 = <input type="number" id="a4Input" min="430" max="450" step="1" value="440"> Hz</label>
          </span>
        </div>
        <div class="tun-body">
          <svg class="gauge" viewBox="0 0 220 128" id="gauge">
            <path id="gArc" fill="none" stroke="#ece7dd" stroke-width="14" stroke-linecap="round"/>
            <path id="gOk" fill="none" stroke="#bfe3c6" stroke-width="14"/>
            <g id="gTicks"></g>
            <line id="needle" x1="110" y1="112" x2="110" y2="30" stroke="#1d1f24" stroke-width="3" stroke-linecap="round"/>
            <circle cx="110" cy="112" r="6" fill="#1d1f24"/>
          </svg>
          <div class="tun-read">
            <div class="lbl">Đang thổi (<span class="wWordL">nốt kèn</span>)</div>
            <div class="tun-note" id="tNote">–</div>
            <div class="sub" id="tSub">Bấm “Bật tuner” và cho phép dùng micro</div>
            <div class="tun-status" id="tStatus"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <section class="card bottom">
    <div class="legend">
      <span><i class="dot" style="background:var(--brass)"></i><span class="wWord">Nốt kèn</span></span>
      <span><i class="dot" style="background:var(--concert)"></i>Âm thanh thật</span>
      <span><i class="dot" style="background:#fff;box-shadow:inset 0 0 0 2px #2fa04a"></i>Tuner đang nghe</span>
      <span class="hint" id="instHint" style="margin:0"></span>
      <span style="margin-left:auto">Bấm piano chọn theo:
        <span class="seg small" id="modeSeg"><button data-mode="written" class="wWord">Nốt kèn</button><button data-mode="concert">Nốt thật</button></span>
      </span>
    </div>
    <div class="piano" id="piano"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   NỐT NHẠC SAXOPHONE — dữ liệu thế bấm & giao diện (chạy offline)
   Quy ước: số MIDI, C4 = 60 (Đô giữa). "Nốt kèn/sáo" = nốt viết theo thế bấm.
   shift = số nửa cung từ nốt viết đến âm thanh thật.
   ===================================================================== */
const $ = id => document.getElementById(id);

/* ---------- Tên nốt ---------- */
const SHARP = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT  = {1:'D♭',3:'E♭',6:'G♭',8:'A♭',10:'B♭'};
const SOL   = ['Đô','Đô♯','Rê','Mi♭','Mi','Fa','Fa♯','Sol','Sol♯','La','Si♭','Si'];
const octv = m => Math.floor(m / 12) - 1;
const pc = m => ((m % 12) + 12) % 12;
const primary = m => ([3,10].includes(pc(m)) ? FLAT[pc(m)] : SHARP[pc(m)]) + octv(m);
const fullName = m => FLAT[pc(m)] ? SHARP[pc(m)] + octv(m) + ' / ' + FLAT[pc(m)] + octv(m) : SHARP[pc(m)] + octv(m);
const f = (name, keys, note='') => ({ name, keys, note });

/* ---------- Vẽ sơ đồ phím chung ---------- */
const HALF_DEFS = [25,50,75].map(p =>
  `<linearGradient id="hf${p}" x1="0" x2="1" y1="0" y2="0"><stop offset="${p/100}" stop-color="#1d1f24"/><stop offset="${p/100}" stop-color="#fff"/></linearGradient>`).join('');
const parseTok = t => { const [id, fr] = t.split(':'); return [id, fr === undefined ? 1 : +fr]; };
const FR_TXT = { .25:'¼', .5:'½', .75:'¾' };
function keysSVG(geo, toks, bg = '', fg = '', vb = '18 20 210 480'){
  const st = new Map(toks.map(parseTok));
  let s = `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" role="img"><defs>${HALF_DEFS}</defs>${bg}`;
  for (const [id,k] of Object.entries(geo)){
    if (k.show && !k.show()) continue;
    const fr = st.get(id) || 0;
    const p = fr >= 1 ? ' p' : '';
    const half = fr > 0 && fr < 1 ? ` style="fill:url(#hf${Math.round(fr*100)})"` : '';
    const cls = `k${p}${k.back ? ' back' : ''}`;
    const shape = k.r ? `<circle class="${cls}" cx="${k.x}" cy="${k.y}" r="${k.r}"${half}/>`
                      : `<ellipse class="${cls}" cx="${k.x}" cy="${k.y}" rx="${k.rx}" ry="${k.ry}"${half}/>`;
    const fs = k.fs ? ` style="font-size:${k.fs}px"` : (k.r && k.r >= 14 ? ' style="font-size:12px"' : '');
    const tx = (k.t !== undefined && !half) ? `<text class="t${p}" x="${k.x}" y="${k.y}"${fs}>${k.t}</text>` : '';
    s += `<g><title>${k.d}</title>${shape}${tx}</g>`;
  }
  return s + fg + '</svg>';
}
function keysSummary(geo, toks){
  if (!toks.length) return 'Không bấm phím nào (mở hết)';
  return toks.map(t => { const [id,fr] = parseTok(t); return (geo[id] ? geo[id].d : id) + (fr < 1 ? ' ' + FR_TXT[fr] : ''); }).join(' · ');
}
const cap = (x, y, t) => `<text class="cap" x="${x}" y="${y}">${t}</text>`;
const body = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w/2}" fill="#f1ede5"/>`;

/* =====================================================================
   1) SAXOPHONE (và Roland Aerophone / Yamaha YDS dùng thế bấm sax)
   ===================================================================== */
const L = ['L1','L2','L3'], R = ['R1','R2','R3'];
const SAX_GEO = {
  oct:{x:36,y:150,rx:14,ry:9,t:'8va',d:'Octave'},
  lowA:{x:36,y:176,rx:11,ry:7,t:'A',d:'A trầm', show:()=>INST.lowA},
  pD:{x:80,y:64,rx:9,ry:15,t:'D',d:'Palm D', show:()=>!INST.ewi},
  pEb:{x:62,y:96,rx:9,ry:15,t:'E♭',d:'Palm E♭', show:()=>!INST.ewi},
  pF:{x:80,y:128,rx:9,ry:15,t:'F',d:'Palm F', show:()=>!INST.ewi},
  fF:{x:130,y:72,rx:13,ry:7,t:'Ff',d:'Front F', show:()=>!INST.ewi},
  L1:{x:130,y:108,r:19,t:'1',d:'T1'},
  bis:{x:130,y:141,r:7,t:'bis',d:'Bis',fs:6.5},
  L2:{x:130,y:174,r:19,t:'2',d:'T2'},
  L3:{x:130,y:226,r:19,t:'3',d:'T3'},
  gs:{x:192,y:222,rx:17,ry:8,t:'G♯',d:'G♯'},
  lcs:{x:178,y:248,rx:13,ry:8,t:'C♯',d:'C♯ trầm'},
  lb:{x:208,y:248,rx:13,ry:8,t:'B',d:'B trầm'},
  lbb:{x:193,y:272,rx:13,ry:8,t:'B♭',d:'B♭ trầm'},
  R1:{x:130,y:312,r:19,t:'1',d:'P1'},
  R2:{x:130,y:366,r:19,t:'2',d:'P2'},
  R3:{x:130,y:420,r:19,t:'3',d:'P3'},
  sE:{x:198,y:310,rx:7,ry:14,t:'E',d:'Side E', show:()=>!INST.ewi},
  sC:{x:198,y:342,rx:7,ry:14,t:'C',d:'Side C'},
  sBb:{x:198,y:374,rx:7,ry:14,t:'B♭',d:'Side B♭'},
  tFs:{x:176,y:398,rx:7,ry:11,t:'F♯',d:'F♯ phụ', show:()=>!INST.ewi},
  hFs:{x:84,y:392,rx:7,ry:11,t:'F♯',d:'F♯ cao', show:()=>!INST.ewi},
  ebk:{x:166,y:462,rx:15,ry:8,t:'E♭',d:'E♭ trầm'},
  lc:{x:136,y:486,rx:17,ry:8,t:'C',d:'C trầm'}
};
const SAX_F = {
  57:[f('Chuẩn',[...L,...R,'lbb','lowA'],'Út trái bấm B♭ trầm + ngón cái trái bấm phím A trầm (chỉ có trên baritone).')],
  58:[f('Chuẩn',[...L,...R,'lbb'],'Ngón út trái bấm phím B♭ trầm.')],
  59:[f('Chuẩn',[...L,...R,'lb'],'Ngón út trái bấm phím B trầm.')],
  60:[f('Chuẩn',[...L,...R,'lc'],'Ngón út phải bấm phím C trầm.')],

/* =====================================================================
   7) KÈN ĐỒNG CÓ VAN — tính theo chuỗi bồi âm (harmonic series)
   ===================================================================== */
const HARM = {2:12,3:19,4:24,5:28,6:31,7:34,8:36,9:38,10:40,12:43,15:47,16:48};
const COMBOS3 = [[[],0],[['2'],1],[['1'],2],[['1','2'],3],[['3'],3],[['2','3'],4],[['1','3'],5],[['1','2','3'],6]];
const COMBOS4 = [...COMBOS3,[['4'],5],[['2','4'],6],[['1','4'],7],[['1','2','4'],8],[['2','3','4'],9],[['1','3','4'],10],[['1','2','3','4'],11]];
function brassOptions(i, m){
  const sides = i.horn ? [['F', i.base], ['B♭', i.base + 5]] : [['', i.base]];
  const combos = i.valves === 4 ? COMBOS4 : COMBOS3;
  const opts = [];
  for (const [side, base] of sides) for (const [p, h] of Object.entries(HARM)){
    if (+p > i.maxPartial) continue;
    for (const [v, low] of combos){
      if (base + h - low !== m) continue;
      let cost = v.length + (v.length === 1 && v[0] === '3' ? 0.6 : 0) + (+p === 7 ? 50 : 0) + (low >= 5 && i.valves !== 4 ? 0.3 : 0);
      if (i.horn) cost += ((m < 68) === (side === 'F') ? 0 : 3);
      opts.push({ side, p:+p, v, low, cost });
    }
  }
  opts.sort((a,b) => a.cost - b.cost || a.p - b.p);
  return opts.slice(0, 4).map((o,k) => ({
    name: (k === 0 ? 'Chuẩn' : 'Thay thế') + (o.side ? ` · bên ${o.side}` : ''),
    valves: o.v, side: o.side, p: o.p,
    note: `${o.v.length ? 'Van ' + o.v.join('+') : 'Không bấm van'} — bồi âm thứ ${o.p}.` +
          (o.p === 7 ? ' Bồi âm 7 hơi non (thấp), cần nâng cao độ.' : '') +
          (o.low >= 5 && i.valves !== 4 ? ' Tổ hợp van này hơi cao, kéo ống chỉnh van 3 hoặc van 1.' : '') +
          (o.side === 'B♭' ? ' Bấm phím ngón cái (sang bên B♭).' : '')
  }));
}

  hint:'Van tô đen = bấm. Cùng một thế van, đổi độ căng môi để lên/xuống các bồi âm. Thang bên phải cho biết bồi âm đang dùng.',

      s += `<g><title>Van ${id}</title><circle class="k${on?' p':''}" cx="${X}" cy="${on ? 112 : 92}" r="20"/><text class="t${on?' p':''}" x="${X}" y="${on?112:92}" style="font-size:15px">${id}</text></g>`;
    });
    if (INST.horn){
      const on = x.side === 'B♭';
      s += `<g><title>Phím ngón cái (F ↔ B♭)</title><ellipse class="k${on?' p':''}" cx="52" cy="290" rx="20" ry="12"/><text class="t${on?' p':''}" x="52" y="290">T</text></g>`;
      s += cap(52,318, on ? 'bên B♭' : 'bên F');
    }
    // thang bồi âm
    const ps = Object.keys(HARM).map(Number).filter(p => p <= INST.maxPartial);
    const y0 = 470, y1 = 260, top = Math.max(...ps);
    s += `<line x1="150" y1="${y0}" x2="150" y2="${y1}" stroke="#d8d2c6" stroke-width="2"/>` + cap(184,252,'BỒI ÂM');
    let lastY = 1e9;
    ps.forEach(p => {
      const y = y0 - (HARM[p] - 12) / (HARM[top] - 12 || 1) * (y0 - y1), on = p === x.p;
      const showLbl = on || lastY - y >= 11; if (showLbl) lastY = y;
      s += `<line x1="${on?136:142}" y1="${y}" x2="${on?200:158}" y2="${y}" stroke="${on?'#b9822a':'#9a958b'}" stroke-width="${on?4:1.5}"/>`;
      if (showLbl) s += `<text class="cap" x="${on?212:168}" y="${y+3}" style="${on?'font-weight:700;fill:#1d1f24;font-size:12px':''}">${p}</text>`;
    });
    return s + '</svg>';
  },
  sum: x => (x.valves.length ? 'Van ' + x.valves.join(' + ') : 'Mở (không van)') + ` · bồi âm ${x.p}` + (x.side ? ` · bên ${x.side}` : '')
};

  I('yds','ewi','Yamaha YDS','Đô',0,58,90,SYS_SAX,'Yamaha YDS (Digital Saxophone): bấm y như saxophone. Mặc định âm thật = nốt bấm; có thể đặt Transpose.')
];
const BY_ID = Object.fromEntries(INSTRUMENTS.map(i => [i.id, i]));

/* ===================== TRẠNG THÁI ===================== */
const store = {
  get(k,d){ try { const v = localStorage.getItem('saxnotes.'+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k,v){ try { localStorage.setItem('saxnotes.'+k, JSON.stringify(v)); } catch(e){} }
};
let INST = BY_ID[store.get('inst2','alto')] || BY_ID.alto;
let sel = store.get('sel', 72);
let mode = store.get('mode','written');
const concertOf = m => m + INST.shift;
const word = () => FAMILIES[INST.fam].word || 'kèn';
function fixSel(){ if (!(sel >= INST.low && sel <= INST.high)) sel = Math.round((INST.low + INST.high) / 2); }
fixSel();

/* ===================== VẼ GIAO DIỆN ===================== */
function groupsOf(i){
  if (i.sys.groups) return i.sys.groups(i);
  const out = [];
  for (let m = i.low; m <= i.high; ){
    const end = Math.min(i.high, m + (11 - pc(m)));
    out.push({ title:`${primary(m)}–${primary(end)}`, from:m, to:end });
    m = end + 1;
  }
  return out;
}
const TINT = ['#fbfaf7','#f3efe6','#ebe4d4'];
function renderGroups(){
  const G = groupsOf(INST);
  let chips = '';
  G.forEach((g, gi) => {
    for (let m = g.from; m <= g.to; m++)
      chips += `<button class="chip${m===sel?' on':''}" style="${m===sel?'':'background:'+TINT[gi%3]}" data-m="${m}" title="${g.title}"><b>${primary(m)}</b><small>♪ ${primary(concertOf(m))}</small></button>`;
  });
  $('groups').innerHTML = `<div class="reg">${G.map((g,gi)=>`<span><i style="background:${TINT[gi%3]}"></i>${g.title}</span>`).join('')}</div><div class="chips">${chips}</div>`;
  $('instHint').textContent = INST.hint + ' Chữ xanh nhỏ = âm thật.';
}

function renderSelected(){
  const c = concertOf(sel), S = INST.sys;
  $('wName').textContent = fullName(sel);
  $('wSol').textContent = SOL[pc(sel)] + ' · ' + INST.name;
  $('cName').textContent = fullName(c);
  $('cSol').textContent = SOL[pc(c)] + ' · nghe như trên piano';
  const SLOTS = S.slots || 3;                       // số ô cố định để sơ đồ không đổi kích thước
  const all = S.fing(sel) || [];
  const list = all.slice(0, SLOTS);
  $('fingTitle').textContent = `Cách bấm nốt ${primary(sel)} — ${INST.name} — ${all.length ? all.length + ' cách' : 'không có thế bấm chuẩn'}`;
  $('fings').style.gridTemplateColumns = `repeat(${SLOTS},minmax(0,1fr))`;
  let html = '';
  for (let i = 0; i < SLOTS; i++){
    const x = list[i];
    if (!x){ html += '<div class="fing empty"></div>'; continue; }
    const sum = S.sum(x);
    html += `
    <div class="fing">
      <h4 title="${x.name}">${x.name}${i===0?'<span class="tag">thường dùng</span>':''}</h4>
      <p title="${x.note || ''}">${x.note || ''}</p>
      <div class="svgbox">${S.svg(x)}</div>
      <div class="keys" title="${sum}">${sum}</div>
    </div>`;
  }
  $('fings').innerHTML = html;
  $('fingHint').textContent = S.hint;
}

/* Piano co giãn theo % chiều ngang — dải phím tự theo nhạc cụ */
const isBlack = m => [1,3,6,8,10].includes(pc(m));
let P_LOW = 48, P_HIGH = 96, WHITES = 29;
function pianoRange(){
  const lo = Math.min(INST.low, INST.low + INST.shift), hi = Math.max(INST.high, INST.high + INST.shift);
  P_LOW = Math.floor(lo / 12) * 12;
  P_HIGH = Math.ceil((hi + 1) / 12) * 12;
  WHITES = 0; for (let m = P_LOW; m <= P_HIGH; m++) if (!isBlack(m)) WHITES++;
}
function renderPiano(){
  pianoRange();
  const c = concertOf(sel), ww = 100 / WHITES, bw = ww * 0.62, W = word();
  let html = '', wi = 0;
  for (let m = P_LOW; m <= P_HIGH; m++){
    const cls = (m===sel?' w':'') + (m===c?' cc':'');
    const badge = m===sel ? `<div class="badge w">${W[0].toUpperCase()+W.slice(1)}</div>` : (m===c ? '<div class="badge cc">Thật</div>' : '');
    const label = SHARP[pc(m)] + octv(m);
    if (!isBlack(m)){
      html += `<div class="wk${cls}${pc(m)===0?' c':''}" data-m="${m}" title="${label}" style="left:${wi*ww}%;width:${ww}%">${badge}<span>${label}</span></div>`;
      wi++;
    } else {
      html += `<div class="bk${cls}" data-m="${m}" title="${label}" style="left:${wi*ww - bw/2}%;width:${bw}%">${badge}<span>${label}</span></div>`;
    }
  }
  $('piano').innerHTML = html;
  markLive();
}

/* ---------- Thanh chọn nhạc cụ ---------- */
function renderInstBar(){
  $('instSeg').innerHTML = INSTRUMENTS.filter(i => i.fam === 'sax').map(i =>
    `<button data-inst="${i.id}" title="${i.hint}"><b>${i.name}</b><small>${i.key}</small></button>`).join('');
  $('fams').innerHTML = Object.entries(FAMILIES).filter(([k]) => k !== 'sax').map(([k, F]) => `
    <div class="fam" data-fam="${k}">
      <button class="famBtn"><b>${F.label} ▾</b><small class="famSel">chọn nhạc cụ</small></button>
      <div class="menu">${INSTRUMENTS.filter(i => i.fam === k).map(i =>
        `<button data-inst="${i.id}" title="${i.hint}"><span>${i.name}</span><small>${i.key}</small></button>`).join('')}</div>
    </div>`).join('');
}
function renderSeg(){
  document.querySelectorAll('[data-inst]').forEach(b => b.classList.toggle('on', b.dataset.inst === INST.id));
  document.querySelectorAll('.fam').forEach(el => {
    const on = el.dataset.fam === INST.fam;
    el.querySelector('.famBtn').classList.toggle('on', on);
    el.querySelector('.famSel').textContent = on ? INST.name : 'chọn nhạc cụ';
  });
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode===mode));
  const W = word();
  document.querySelectorAll('.wWord').forEach(e => e.textContent = 'Nốt ' + W);
  document.querySelectorAll('.wWordL').forEach(e => e.textContent = 'nốt ' + W);
}
function renderAll(){ renderSeg(); renderGroups(); renderSelected(); renderPiano(); }
function setInst(id){
  INST = BY_ID[id]; store.set('inst2', id);
  fixSel(); store.set('sel', sel);
  updateTunerRange(); renderAll();
}

/* ===================== ÂM THANH (Web Audio, không cần file) ===================== */
let ctx = null;
function play(midi){
  try{
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime, freq = 440 * Math.pow(2, (midi-69)/12);
    const osc = ctx.createOscillator(), osc2 = ctx.createOscillator();
    const filt = ctx.createBiquadFilter(), g = ctx.createGain();
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    osc.type = INST.fam === 'flute' ? 'triangle' : 'sawtooth'; osc.frequency.value = freq;
    osc2.type = INST.fam === 'flute' ? 'sine' : 'square'; osc2.frequency.value = freq; osc2.detune.value = 4;
    lfo.frequency.value = 5.2; lfoG.gain.value = freq * 0.006;
    lfo.connect(lfoG); lfoG.connect(osc.frequency); lfoG.connect(osc2.frequency);
    filt.type = 'lowpass'; filt.frequency.value = Math.min(freq * 3.2, 5000); filt.Q.value = 1.2;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.06);
    g.gain.setValueAtTime(0.16, t + 0.9);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
    osc.connect(filt); osc2.connect(filt); filt.connect(g); g.connect(ctx.destination);
    [osc,osc2,lfo].forEach(o => { o.start(t); o.stop(t + 1.35); });
  } catch(e){}
}

/* ===================== SỰ KIỆN ===================== */
function select(m, sound){
  sel = Math.max(INST.low, Math.min(INST.high, m)); store.set('sel', sel);
  renderGroups(); renderSelected(); renderPiano();
  if (sound) play(concertOf(sel));
}
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function closeMenus(){ document.querySelectorAll('.fam.open').forEach(e => e.classList.remove('open')); }
document.addEventListener('click', e => {
  const fb = e.target.closest('.famBtn');
  if (fb){ const fam = fb.parentElement, was = fam.classList.contains('open'); closeMenus(); if (!was) fam.classList.add('open'); return; }
  const ib = e.target.closest('[data-inst]');
  if (ib){ closeMenus(); setInst(ib.dataset.inst); return; }
  if (!e.target.closest('.menu')) closeMenus();
});
$('modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode; store.set('mode', mode); renderSeg();
});
$('groups').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (b) select(+b.dataset.m, true);
});
$('piano').addEventListener('click', e => {
  const k = e.target.closest('[data-m]'); if (!k) return;
  const m = +k.dataset.m;
  play(m);
  const written = mode === 'written' ? m : m - INST.shift;
  if (written < INST.low || written > INST.high) {
    toast(`${primary(m)} nằm ngoài tầm âm của ${INST.name}`);
    return;
  }
  sel = written; store.set('sel', sel);
  renderGroups(); renderSelected(); renderPiano();
});
$('playBtn').addEventListener('click', () => play(concertOf(sel)));
$('prevBtn').addEventListener('click', () => select(sel - 1, true));
$('nextBtn').addEventListener('click', () => select(sel + 1, true));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') closeMenus();
  if (e.key === 'ArrowLeft') { select(sel - 1, true); e.preventDefault(); }
  if (e.key === 'ArrowRight') { select(sel + 1, true); e.preventDefault(); }
  if (e.key === ' ') { play(concertOf(sel)); e.preventDefault(); }
});

/* ===================== TUNER (micro) ===================== */
let liveMidi = null;
let micStream = null, micCtx = null, analyser = null, rafId = 0, buf = null;
let freqHist = [], centsSmooth = 0, lastSeen = 0, followLast = null, followCount = 0;
let a4 = store.get('a4', 440);
$('a4Input').value = a4;
$('followChk').checked = store.get('follow', false);

function markLive(){
  document.querySelectorAll('#piano .live').forEach(e => e.classList.remove('live'));
  if (liveMidi != null){ const e = document.querySelector(`#piano [data-m="${liveMidi}"]`); if (e) e.classList.add('live'); }
}
const GCX = 110, GCY = 112, GR = 88;
function polar(cents, r = GR){ const a = (cents / 50) * (Math.PI / 2); return [GCX + r * Math.sin(a), GCY - r * Math.cos(a)]; }
function arc(c1, c2){ const [x1,y1] = polar(c1), [x2,y2] = polar(c2); return `M${x1} ${y1} A${GR} ${GR} 0 0 1 ${x2} ${y2}`; }
(function drawGauge(){
  $('gArc').setAttribute('d', arc(-50, 50));
  $('gOk').setAttribute('d', arc(-5, 5));
  let t = '';
  for (const c of [-50,-40,-30,-20,-10,0,10,20,30,40,50]){
    const [x1,y1] = polar(c, GR - 12), [x2,y2] = polar(c, GR - (c % 50 === 0 || c === 0 ? 22 : 17));
    t += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#9a958b" stroke-width="${c===0?2:1}"/>`;
    if (c % 25 === 0 || c === 0){ const [tx,ty] = polar(c, GR - 32); t += `<text x="${tx}" y="${ty + 3}">${c > 0 ? '+' + c : c}</text>`; }
  }
  t += `<text x="${GCX}" y="${GCY + 14}">cent</text>`;
  $('gTicks').innerHTML = t;
})();
/* Ô nhắc nhở giữ tối thiểu 2 giây */
const HOLD_MS = 2000;
let stKey = '', stShownAt = 0, stLastUpdate = 0;
function setStatus(key, cls, text){
  const now = performance.now(), st = $('tStatus');
  if (key === stKey){
    if (key){ st.textContent = text; st.className = 'tun-status ' + (cls || ''); stLastUpdate = now; }
    return;
  }
  const canChange = !stKey || (key ? now - stShownAt >= HOLD_MS : now - stLastUpdate >= HOLD_MS);
  if (!canChange) return;
  stKey = key; stShownAt = stLastUpdate = now;
  st.className = 'tun-status ' + (cls || '');
  st.textContent = key ? text : '';
}
function resetStatus(){ stKey = ''; $('tStatus').className = 'tun-status'; $('tStatus').textContent = ''; }
function setNeedle(c){
  const deg = Math.max(-50, Math.min(50, c)) / 50 * 90;
  $('needle').style.transform = `rotate(${deg}deg)`;
  $('needle').setAttribute('stroke', Math.abs(c) <= 5 ? '#2fa04a' : Math.abs(c) <= 15 ? '#c08a1e' : '#c0392b');
}

/* Dò cao độ bằng thuật toán YIN */
let TUNE = { minF:90, maxF:1600, fft:4096 };
const hz = m => a4 * Math.pow(2, (m - 69) / 12);
function updateTunerRange(){
  const minF = Math.max(22, hz(INST.low + INST.shift) * 0.85), maxF = Math.min(4500, hz(INST.high + INST.shift) * 1.25);
  TUNE = { minF, maxF, fft: minF < 120 ? 8192 : 4096 };
  if (analyser && analyser.fftSize !== TUNE.fft){ analyser.fftSize = TUNE.fft; buf = new Float32Array(TUNE.fft); }
}
function detectPitch(raw, srRaw){
  let rms = 0; for (let i = 0; i < raw.length; i++) rms += raw[i] * raw[i];
  rms = Math.sqrt(rms / raw.length);
  if (rms < 0.012) return null;
  const dec = TUNE.minF < 60 ? 4 : TUNE.minF < 120 ? 2 : 1;
  let data = raw, sr = srRaw;
  if (dec > 1){
    data = new Float32Array(Math.floor(raw.length / dec));
    for (let i = 0; i < data.length; i++){ let a = 0; for (let k = 0; k < dec; k++) a += raw[i*dec + k]; data[i] = a / dec; }
    sr = srRaw / dec;
  }
  const W = Math.floor(data.length / 2);
  const tauMin = Math.max(2, Math.floor(sr / TUNE.maxF)), tauMax = Math.min(W - 1, Math.ceil(sr / TUNE.minF));
  const d = new Float32Array(tauMax + 1);
  for (let tau = 1; tau <= tauMax; tau++){
    let s = 0;
    for (let i = 0; i < W; i++){ const x = data[i] - data[i + tau]; s += x * x; }
    d[tau] = s;
  }
  let run = 0; const cm = new Float32Array(tauMax + 1); cm[0] = 1;
  for (let tau = 1; tau <= tauMax; tau++){ run += d[tau]; cm[tau] = run ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++){
    if (cm[t] < 0.12){ while (t + 1 <= tauMax && cm[t + 1] < cm[t]) t++; tau = t; break; }
  }
  if (tau < 0) return null;
  const x0 = cm[tau - 1] ?? cm[tau], x2 = cm[tau + 1] ?? cm[tau], x1 = cm[tau];
  const den = x0 + x2 - 2 * x1;
  return sr / (den ? tau + (x0 - x2) / (2 * den) : tau);
}
function tunerLoop(){
  analyser.getFloatTimeDomainData(buf);
  const freq = detectPitch(buf, micCtx.sampleRate);
  const now = performance.now();
  if (freq){
    freqHist.push(freq); if (freqHist.length > 5) freqHist.shift();
    const med = [...freqHist].sort((a,b) => a - b)[Math.floor(freqHist.length / 2)];
    const exact = 69 + 12 * Math.log2(med / a4);
    const concert = Math.round(exact);
    const cents = (exact - concert) * 100;
    centsSmooth = Math.abs(cents - centsSmooth) > 30 ? cents : centsSmooth * 0.6 + cents * 0.4;
    lastSeen = now;
    showReading(concert, centsSmooth, med);
  } else if (now - lastSeen > 600){
    freqHist = [];
    if (liveMidi != null){ liveMidi = null; markLive(); }
    setNeedle(0);
    setStatus('', '', '');
    if (now - lastSeen > HOLD_MS && !stKey){
      $('tNote').textContent = '–';
      $('tSub').textContent = 'Đang nghe… hãy thổi một nốt dài';
    }
  }
  rafId = requestAnimationFrame(tunerLoop);
}
function showReading(concert, cents, freq){
  const horn = concert - INST.shift;
  const c = Math.round(cents);
  $('tNote').textContent = primary(horn);
  $('tSub').textContent = `Âm thật ${primary(concert)} · ${freq.toFixed(1)} Hz · ${c > 0 ? '+' : ''}${c} cent`;
  setNeedle(cents);
  if (liveMidi !== concert){ liveMidi = concert; markLive(); }
  if ($('followChk').checked && horn >= INST.low && horn <= INST.high && horn !== sel){
    followCount = (followLast === horn) ? followCount + 1 : 1; followLast = horn;
    if (followCount >= 8){ sel = horn; store.set('sel', sel); renderGroups(); renderSelected(); renderPiano(); }
  }
  const adv = ADV[INST.fam === 'sax' || INST.fam === 'wood' ? 'reed' : INST.fam] || ADV.reed;
  if (horn !== sel){
    setStatus('other' + horn, 'st-other', `Đang thổi ${primary(horn)} — khác nốt đã chọn (${primary(sel)})`);
  } else if (Math.abs(c) <= 5){
    setStatus('ok' + horn, 'st-ok', `✓ Đúng nốt ${primary(sel)}, chuẩn cao độ`);
  } else {
    const cls = Math.abs(c) <= 15 ? 'st-near' : 'st-off';
    if (c > 0) setStatus('hi' + horn, cls, `Đúng nốt nhưng cao ${c} cent — ${adv[0]}`);
    else       setStatus('lo' + horn, cls, `Đúng nốt nhưng thấp ${-c} cent — ${adv[1]}`);
  }
}
async function startTuner(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Trình duyệt này không hỗ trợ micro. Hãy dùng Chrome hoặc Edge.'); return;
  }
  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
  } catch(e){
    toast('Không mở được micro — hãy cho phép quyền micro cho trang này.'); return;
  }
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = micCtx.createMediaStreamSource(micStream);
  analyser = micCtx.createAnalyser(); updateTunerRange(); analyser.fftSize = TUNE.fft;
  src.connect(analyser);
  buf = new Float32Array(analyser.fftSize);
  $('micBtn').textContent = '■ Tắt tuner'; $('micBtn').classList.add('on');
  $('tSub').textContent = 'Đang nghe… hãy thổi một nốt dài';
  lastSeen = 0; tunerLoop();
}
function stopTuner(){
  cancelAnimationFrame(rafId);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micCtx) micCtx.close();
  micStream = micCtx = analyser = null;
  liveMidi = null; markLive(); setNeedle(0);
  $('micBtn').textContent = '🎤 Bật tuner'; $('micBtn').classList.remove('on');
  $('tNote').textContent = '–'; $('tSub').textContent = 'Tuner đã tắt'; resetStatus();
}
$('micBtn').addEventListener('click', () => micStream ? stopTuner() : startTuner());
$('followChk').addEventListener('change', e => store.set('follow', e.target.checked));
$('a4Input').addEventListener('change', e => {
  const v = Math.max(430, Math.min(450, +e.target.value || 440));
  a4 = v; e.target.value = v; store.set('a4', v); updateTunerRange();
});
setNeedle(0);

renderInstBar();
renderAll();

</script>
